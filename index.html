<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6fb" />
<title>柳牧也 · 自动化 / 嵌入式 · 个人简历</title>
<meta name="description" content="柳牧也，上海第二工业大学自动化专业大一在读。方向：嵌入式控制、传感器采集、PID 控制、智能车 / 机器人。求职方向：自动化 / 嵌入式 / 控制算法 / 科研助理。" />
<script>document.documentElement.className = 'js';</script>
<style>
/* ============ 主题变量 ============ */
:root{
  color-scheme: light;
  --bg:#f5f6fb;
  --nav-bg:rgba(245,246,251,.82);
  --surface:#ffffff;
  --surface-2:#eef0f8;
  --border:rgba(15,23,42,.09);
  --text:#0e1526;
  --text-2:#4a5568;
  --text-3:#8b95a9;
  --primary:#4f46e5;
  --primary-2:#0ea5e9;
  --primary-soft:rgba(79,70,229,.10);
  --btn-grad:linear-gradient(135deg,#4f46e5,#0ea5e9);
  --glow-1:rgba(79,70,229,.14);
  --glow-2:rgba(14,165,233,.13);
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px -18px rgba(15,23,42,.35);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05), 0 18px 40px -20px rgba(15,23,42,.4);
  --radius:16px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#070a12;
  --nav-bg:rgba(7,10,18,.78);
  --surface:#101625;
  --surface-2:#171e30;
  --border:rgba(148,163,184,.15);
  --text:#e9eefb;
  --text-2:#a3aec4;
  --text-3:#6d7a94;
  --primary:#8b8bff;
  --primary-2:#3ec7f5;
  --primary-soft:rgba(139,139,255,.14);
  --btn-grad:linear-gradient(135deg,#5b5bf0,#0ea5e9);
  --glow-1:rgba(99,91,255,.20);
  --glow-2:rgba(14,165,233,.14);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px -20px rgba(0,0,0,.9);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 22px 46px -24px rgba(0,0,0,1);
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box;}
html{
  scroll-behavior:smooth;
  scroll-padding-top:88px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:16px;
  line-height:1.65;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background-color .25s ease,color .25s ease;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(58% 46% at 10% 0%, var(--glow-1), transparent 70%),
    radial-gradient(48% 42% at 90% 6%, var(--glow-2), transparent 70%);
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.3;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
a{color:inherit;}
svg{display:block;flex:none;}
::selection{background:var(--primary);color:#fff;}

.container{width:min(1120px,calc(100% - 40px));margin-inline:auto;}

/* ============ 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  backdrop-filter:blur(16px) saturate(170%);
  border-bottom:1px solid transparent;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .25s ease;
}
.nav.is-scrolled{
  border-bottom-color:var(--border);
  box-shadow:0 8px 26px -22px rgba(15,23,42,.9);
}
.nav-inner{
  width:min(1120px,calc(100% - 40px));
  margin:0 auto;
  height:64px;
  display:flex;
  align-items:center;
  gap:14px;
}
.brand{
  display:flex;align-items:center;gap:9px;
  font-size:15.5px;font-weight:700;letter-spacing:.01em;
  text-decoration:none;color:var(--text);flex:none;
}
.brand-mark{
  width:28px;height:28px;border-radius:9px;
  background:var(--btn-grad);
  display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 8px 18px -8px var(--primary);
}
.brand small{
  display:block;font-size:11px;font-weight:500;color:var(--text-3);letter-spacing:.06em;
}
.nav-links{
  display:flex;align-items:center;gap:2px;
  margin-left:auto;
}
.nav-links a{
  padding:8px 13px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--text-2);
  text-decoration:none;transition:color .18s ease,background-color .18s ease;
  white-space:nowrap;
}
.nav-links a:hover{color:var(--text);background:var(--surface-2);}
.nav-links a.active{color:var(--primary);background:var(--primary-soft);}
.nav-actions{display:flex;align-items:center;gap:8px;flex:none;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  display:grid;place-items:center;cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background-color .18s ease,transform .18s ease;
  font-family:inherit;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}
.icon-btn:active{transform:scale(.95);}
.menu-btn{display:none;}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:12px;
  font-family:inherit;font-size:14px;font-weight:600;
  border:1px solid transparent;cursor:pointer;text-decoration:none;
  transition:transform .18s ease,box-shadow .18s ease,color .18s ease,border-color .18s ease,background-color .18s ease;
  white-space:nowrap;
}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:10px;}
.btn-primary{
  background:var(--btn-grad);color:#fff;
  box-shadow:0 12px 26px -14px var(--primary);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px var(--primary);}
.btn-ghost{
  background:var(--surface);border-color:var(--border);color:var(--text-2);
}
.btn-ghost:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);}
.btn:focus-visible,.icon-btn:focus-visible,.tab:focus-visible,a:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;
}

/* ============ 区块 ============ */
section{padding:72px 0;}
.section-head{margin-bottom:34px;max-width:760px;}
.section-kicker{
  display:inline-block;
  font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--primary);
  background:var(--primary-soft);
  padding:4px 10px;border-radius:999px;
}
.section-head h2{font-size:clamp(1.5rem,3.2vw,2rem);margin:12px 0 8px;}
.section-sub{color:var(--text-2);font-size:15px;}

/* ============ Hero ============ */
#home{padding-top:132px;padding-bottom:64px;}
.hero-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:42px;align-items:start;}
.hero-side{display:flex;flex-direction:column;gap:18px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border);
  padding:6px 13px;border-radius:999px;box-shadow:var(--shadow);
}
.eyebrow .dot{
  width:7px;height:7px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.18);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.55;transform:scale(.82);}
}
.hero h1{
  font-size:clamp(2.6rem,7vw,4rem);
  line-height:1.05;font-weight:800;letter-spacing:-.035em;
  margin:18px 0 10px;
  background:linear-gradient(120deg,var(--primary) 0%,var(--primary-2) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-role{
  font-size:clamp(.98rem,2vw,1.12rem);
  font-weight:600;color:var(--text-2);
  margin-bottom:16px;
  letter-spacing:.01em;
}
.hero-desc{color:var(--text-2);font-size:15.2px;max-width:62ch;line-height:1.8;}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  font-size:12.8px;font-weight:500;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  transition:color .18s ease,border-color .18s ease,background-color .18s ease,transform .18s ease;
}
.badge:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px);}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center;}
.contact-empty{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 16px;border-radius:12px;
  border:1px dashed var(--border);background:var(--surface);
  color:var(--text-3);font-size:13.5px;
}
.contact-empty em{font-style:normal;font-size:12.5px;opacity:.8;}

/* ---------- 头像 ---------- */
.avatar-frame{
  align-self:center;
  width:100%;
  max-width:268px;
  padding:3px;
  border-radius:26px;
  background:var(--btn-grad);
  box-shadow:0 22px 44px -24px var(--primary);
  transition:transform .25s ease,box-shadow .25s ease;
}
.avatar-frame:hover{transform:translateY(-3px);box-shadow:0 30px 54px -26px var(--primary);}
.avatar-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  border-radius:23px;
  overflow:hidden;
  background:linear-gradient(135deg,var(--primary-soft),var(--surface-2));
  display:grid;
  place-items:center;
}
.avatar-wrap::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px var(--border);
  pointer-events:none;
  z-index:2;
}
.avatar-wrap img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  opacity:0;
  z-index:1;
  transition:opacity .45s ease;
}
.avatar-wrap img.is-loaded{opacity:1;}
.avatar-fallback{
  font-size:2.9rem;
  font-weight:800;
  letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  user-select:none;
  z-index:0;
}

.info-card{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 22px 16px;
  box-shadow:var(--shadow);
}
.info-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--btn-grad);
}
.info-title{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px;
}
.info-list{margin:0;}
.info-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9.5px 0;border-bottom:1px dashed var(--border);font-size:14px;
}
.info-row:last-child{border-bottom:0;}
.info-row dt{color:var(--text-3);flex:none;font-size:13px;}
.info-row dd{margin:0;text-align:right;font-weight:600;color:var(--text);font-size:13.6px;line-height:1.5;}

/* ============ 亮点卡片 ============ */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;}
.hl-card{
  position:relative;
  padding:22px;
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.hl-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
.hl-icon{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  color:var(--primary);
  background:var(--primary-soft);
  border:1px solid var(--border);
  margin-bottom:14px;
}
.hl-card h3{font-size:15.4px;margin-bottom:7px;}
.hl-card p{font-size:13.8px;color:var(--text-2);line-height:1.72;}

/* ============ Tabs ============ */
.tabs{
  display:flex;flex-wrap:wrap;gap:4px;
  padding:5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:14px;
  width:fit-content;max-width:100%;
  margin-bottom:26px;
}
.tab{
  appearance:none;border:0;background:transparent;
  font-family:inherit;font-size:13.8px;font-weight:600;
  color:var(--text-2);
  padding:8px 16px;border-radius:10px;
  cursor:pointer;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.tab:hover{color:var(--text);}
.tab[aria-selected="true"]{
  background:var(--surface);
  color:var(--primary);
  box-shadow:0 2px 10px -5px rgba(15,23,42,.45);
}
.tab-panel[hidden]{display:none;}
.tab-panel{animation:fadeUp .28s ease both;}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:none;}
}

/* ============ 时间线 ============ */
.timeline{position:relative;padding-left:26px;}
.timeline::before{
  content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2),transparent);
  opacity:.35;
}
.tl-item{position:relative;padding-bottom:30px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:'';position:absolute;left:-26px;top:7px;
  width:12px;height:12px;border-radius:50%;
  background:var(--surface);
  border:2px solid var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}
.tl-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.tl-org{font-size:16px;line-height:1.5;}
.tl-role{font-size:13.4px;color:var(--text-2);margin-top:4px;font-weight:500;}
.tl-period{
  flex:none;font-size:12.5px;font-weight:600;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--border);
  padding:4px 11px;border-radius:999px;white-space:nowrap;
}
.bullets{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
.bullets li{
  position:relative;padding-left:18px;
  font-size:14.3px;color:var(--text-2);line-height:1.75;
}
.bullets li::before{
  content:'';position:absolute;left:2px;top:.72em;
  width:6px;height:6px;border-radius:1.5px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  transform:translateY(-50%) rotate(45deg);
  opacity:.85;
}
.bullets.sm li{font-size:13.6px;}

/* ============ 项目卡片 ============ */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.proj-card{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  padding:24px;
  border-radius:18px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.proj-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
  background:var(--btn-grad);
  transform:scaleX(0);transform-origin:left;
  transition:transform .28s ease;
}
.proj-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
.proj-card:hover::after{transform:scaleX(1);}
.proj-card h3{font-size:16px;line-height:1.45;}
.proj-meta{
  display:inline-block;margin-top:7px;
  font-size:12.3px;font-weight:600;color:var(--text-3);letter-spacing:.01em;
}
.proj-desc{font-size:13.8px;color:var(--text-2);margin-top:12px;line-height:1.72;}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:16px;}
.tag{
  display:inline-flex;align-items:center;
  padding:4.5px 10px;border-radius:8px;
  font-size:12.2px;font-weight:500;
  background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--border);
  transition:color .18s ease,border-color .18s ease,background-color .18s ease;
}
.tag:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}
.tag.primary{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}

/* ============ 技能 ============ */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:18px;}
.skill-card{
  padding:22px;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.skill-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.skill-card h3{
  display:flex;align-items:center;gap:9px;
  font-size:14.6px;margin-bottom:14px;
}
.skill-card h3 .ico{color:var(--primary);}
.skill-tags{display:flex;flex-wrap:wrap;gap:7px;}

/* ============ 教育 ============ */
.edu-card{
  position:relative;overflow:hidden;
  padding:28px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.edu-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--btn-grad);
}
.edu-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.edu-head h3{font-size:18px;}
.edu-major{font-size:14px;color:var(--text-2);margin-top:5px;font-weight:500;}
.edu-block{margin-top:22px;}
.edu-block h4{
  font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:11px;
}
.cert-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:22px;}
.cert{
  display:flex;align-items:center;gap:11px;
  padding:13px 16px;border-radius:13px;
  background:var(--surface);border:1px solid var(--border);
  font-size:13.6px;color:var(--text-2);
  transition:transform .2s ease,border-color .2s ease,color .18s ease;
}
.cert:hover{transform:translateY(-2px);border-color:var(--primary);color:var(--text);}
.cert .ico{color:var(--primary);}
.cert b{color:var(--text);font-weight:600;}

.tbd{
  display:inline-block;padding:0 6px;border-radius:6px;
  background:var(--surface-2);border:1px dashed var(--border);
  color:var(--text-3);font-size:.84em;line-height:1.6;
}

/* ============ 页脚 ============ */
footer{
  border-top:1px solid var(--border);
  padding:30px 0;margin-top:36px;
  color:var(--text-3);font-size:13px;
}
.footer-inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;}
.footer-inner a{color:var(--text-2);text-decoration:none;}
.footer-inner a:hover{color:var(--primary);}

/* ============ 回到顶部 ============ */
.fab{
  position:fixed;right:20px;bottom:24px;z-index:90;
  width:44px;height:44px;border-radius:14px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateY(12px);
  transition:opacity .22s ease,transform .22s ease,color .18s ease,border-color .18s ease;
  font-family:inherit;
}
.fab.show{opacity:1;pointer-events:auto;transform:none;}
.fab:hover{color:var(--primary);border-color:var(--primary);}

/* ============ 动效 ============ */
.js .reveal{
  opacity:0;transform:translateY(18px);
  transition:opacity .55s cubic-bezier(.22,.8,.32,1),transform .55s cubic-bezier(.22,.8,.32,1);
  will-change:opacity,transform;
}
.js .reveal.in{opacity:1;transform:none;}

/* ============ 响应式 ============ */
@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:30px;}
  #home{padding-top:116px;}
  .avatar-frame{max-width:216px;}
}
@media (max-width:820px){
  .nav-links{
    position:absolute;top:calc(100% + 10px);left:16px;right:16px;
    flex-direction:column;align-items:stretch;gap:2px;
    margin:0;padding:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-lg);
    display:none;
  }
  .nav-links.open{display:flex;}

  /* --------- 头像加载：按候选列表依次尝试 --------- */
  function initAvatar(){
    var img = $('#avatarImg');
    if (!img) return;

    var queue = AVATAR_SOURCES.slice();

    function tryNext(){
      if (!queue.length) {
        // 全部失败：移除 img，露出底层文字占位
        if (img.parentNode) img.parentNode.removeChild(img);
        return;
      }
      img.src = queue.shift();
    }

    img.addEventListener('load', function(){
      if (img.naturalWidth > 0) img.classList.add('is-loaded');
      else tryNext();
    });

    img.addEventListener('error', tryNext);

    tryNext();
  }

  function copyText(text, labelEl){
    if (!text) return;
    var done = function(){
      if (!labelEl) return;
      var old = labelEl.textContent;
      labelEl.textContent = '已复制 ✓';
      setTimeout(function(){ labelEl.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) { /* 忽略 */ }
  }

  /* ============================================================
   *  Tabs 交互（含键盘方向键）
   * ============================================================ */
  function initTabs(root){
    var tabs = $$('[role="tab"]', root);
    var panels = $$('[role="tabpanel"]', root);
    if (!tabs.length) return;

    function select(idx, focus){
      tabs.forEach(function(t, i){
        var on = i === idx;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        if (panels[i]) panels[i].hidden = !on;
      });
      if (focus && tabs[idx]) tabs[idx].focus();
    }

    tabs.forEach(function(t, i){
      t.addEventListener('click', function(){ select(i, false); });
      t.addEventListener('keydown', function(e){
        var n = -1;
        if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = tabs.length - 1;
        else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(i, true); return; }
        if (n > -1) { e.preventDefault(); select(n, true); }
      });
    });

    select(0, false);
  }

  function initNav(){
    var nav = $('#nav');
    var navLinks = $('#navLinks');
    var menuBtn = $('#menuBtn');
    var toTop = $('#toTop');
    var links = $$('#navLinks a');
    var sections = $$('main section');

    menuBtn.addEventListener('click', function(){
      var open = navLinks.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    links.forEach(function(a){
      a.addEventListener('click', function(){
        navLinks.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
      });
    });

    toTop.addEventListener('click', function(){
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });

    document.addEventListener('click', function(e){
      if (!navLinks.classList.contains('open')) return;
      if (navLinks.contains(e.target) || menuBtn.contains(e.target)) return;
      navLinks.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    });

    var ticking = false;
    function update(){
      var y = window.pageYOffset || document.documentElement.scrollTop;
      nav.classList.toggle('is-scrolled', y > 10);
      toTop.classList.toggle('show', y > 480);

      var cur = '';
      sections.forEach(function(s){
        if (s.getBoundingClientRect().top <= 140) cur = s.id;
      });
      links.forEach(function(a){
        a.classList.toggle('active', a.getAttribute('data-target') === cur);
      });
      ticking = false;
    }
    window.addEventListener('scroll', function(){
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  }

  /* ============================================================
   *  主题
   * ============================================================ */
  function initTheme(){
    var btn = $('#themeBtn');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var saved = null;
    try { saved = localStorage.getItem('resume-theme'); } catch (e) {}

    function apply(theme){
      document.documentElement.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'dark' ? icon('sun', 18) : icon('moon', 18);
      btn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#070a12' : '#f5f6fb');
    }

    apply(saved || (mq.matches ? 'dark' : 'light'));

    btn.addEventListener('click', function(){
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem('resume-theme', next); } catch (e) {}
    });

    // 用户未手动选择时，跟随系统
    var onSystemChange = function(e){
      var manual = null;
      try { manual = localStorage.getItem('resume-theme'); } catch (err) {}
      if (!manual) apply(e.matches ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }

  /* ============================================================
   *  滚动淡入
   * ============================================================ */
  function initReveal(){
    var els = $$('.reveal');
    if (!els.length) return;

    if (!('IntersectionObserver' in window)) {
      els.forEach(function(el){ el.classList.add('in'); });
      return;
    }

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) {
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });

    els.forEach(function(el){ io.observe(el); });

    // 首屏立即显示
    setTimeout(function(){
      els.forEach(function(el){
        if (el.getBoundingClientRect().top < window.innerHeight * 0.9) el.classList.add('in');
      });
    }, 60);
  }

})();
